# Mi Notes Workflow Add Or Enhance Sync Feature

## Action

Follow the add-or-enhance-sync-feature workflow:
1. Create or update Java classes for the sync provider under app/src/main/java/net/micode/notes/sync/[provider]/
2. Update AndroidManifest.xml to register new services or permissions
3. Modify UI activity classes (e.g., NoteEditActivity, NotesPreferenceActivity, NotesListActivity) to integrate the new sync feature
4. Add or update string resources in app/src/main/values/strings.xml and res/values/strings.xml
5. If needed, add or update translations in app/src/main/values-zh-rCN/strings.xml, app/src/main/values-zh-rTW/strings.xml, res/values-zh-rCN/strings.xml, and res/values-zh-rTW/strings.xml
6. Update or create relevant layout XML files (e.g., res/layout/activity_preferences.xml) to reflect new sync options

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: app/src/main/java/net/micode/notes/sync/*/*.java, app/src/main/AndroidManifest.xml, app/src/main/java/net/micode/notes/ui/*.java

